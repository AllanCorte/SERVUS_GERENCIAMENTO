{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}SERVUS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark py-3" style="background-color: #74c69d;">
        <div class="container">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/pessoas/">Pessoas</a></li>
                <li class="nav-item"><a class="nav-link" href="/ministerios/">Ministérios</a></li>
                <li class="nav-item"><a class="nav-link" href="/eventos/">Encontros</a></li>
            </ul>
            <a class="navbar-brand mx-auto fs-3 fw-bold" href="/">SERVUS</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/financeiro/">Financeiro</a></li>
                <li class="nav-item"><a class="nav-link" href="/nucleo/">Núcleo</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="/logout/">Sair</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        {% block conteudo %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
