{% extends "base.html" %}
{% block titulo %}Deletar Ministerio - SERVUS{% endblock  %}

{% block conteudo %}

<div class="card">
    <div class="card-body">
        <h4>Tem certeza?</h4>
        <p>Deseja deletar o ministério <strong>{{ ministerio.nome }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, deletar</button>
            <a href="{% url 'lista_ministerios' %}" class="btn btn-outline-dark">Cancelar</a>
        </form>
    </div>
</div>

{% endblock %}
