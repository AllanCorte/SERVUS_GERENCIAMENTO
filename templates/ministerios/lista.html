{% extends "base.html" %}

{% block titulo %}Ministérios - SERVUS{% endblock %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4>Ministérios</h4>
    <a href="{% url 'novo_ministerio' %}" class="btn btn-dark">Novo Ministério</a>
</div>

<div class="card">
    <div class="card-body">
        {% for ministerio in ministerios %}
        <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <span class="fw-bold">{{ ministerio.nome }}</span>
            <a href="{% url 'detalhe_ministerio' ministerio.pk %}" class="btn btn-sm btn-outline-dark">Ver</a>
        </div>
        {% empty %}
        <p class="text-muted mb-0">Nenhum ministério cadastrado.</p>
        {% endfor %}
    </div>
</div>

{% endblock %}
